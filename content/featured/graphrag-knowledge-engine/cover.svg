<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" role="img" aria-labelledby="title desc">
  <title id="title">GraphRAG Knowledge Engine pipeline</title>
  <desc id="desc">Documents flow through chunking and embedding into Neo4j hybrid retrieval and LLM reasoning.</desc>
  <rect width="700" height="400" fill="#0d0d0d"/>
  <rect x="16" y="16" width="668" height="368" rx="10" fill="#161616" stroke="#222222" stroke-width="1"/>
  <text x="36" y="48" fill="#6e6e6e" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11" letter-spacing="0.08em">PIPELINE</text>
  <text x="36" y="72" fill="#f0f0f0" font-family="system-ui, sans-serif" font-size="18" font-weight="600">GraphRAG Knowledge Engine</text>

  <!-- nodes -->
  <rect x="40" y="130" width="100" height="56" rx="8" fill="#0d0d0d" stroke="#4eb5ff" stroke-width="1.5"/>
  <text x="90" y="155" text-anchor="middle" fill="#f0f0f0" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Docs</text>
  <text x="90" y="172" text-anchor="middle" fill="#888888" font-family="ui-monospace, monospace" font-size="10">PDF � filings</text>

  <path d="M148 158 H178" stroke="#4eb5ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="130" width="110" height="56" rx="8" fill="#0d0d0d" stroke="#4eb5ff" stroke-width="1.5"/>
  <text x="235" y="155" text-anchor="middle" fill="#f0f0f0" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Chunk � Embed</text>
  <text x="235" y="172" text-anchor="middle" fill="#888888" font-family="ui-monospace, monospace" font-size="10">vectors</text>

  <path d="M298 158 H328" stroke="#4eb5ff" stroke-width="1.5"/>

  <!-- amber hero stage -->
  <rect x="330" y="118" width="140" height="80" rx="8" fill="rgba(232,165,75,0.12)" stroke="#e8a54b" stroke-width="1.5"/>
  <text x="400" y="148" text-anchor="middle" fill="#e8a54b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Neo4j + Hybrid</text>
  <text x="400" y="168" text-anchor="middle" fill="#f0f0f0" font-family="ui-monospace, monospace" font-size="10">graph � vector � FT</text>
  <text x="400" y="184" text-anchor="middle" fill="#888888" font-family="ui-monospace, monospace" font-size="10">retrieval</text>

  <path d="M478 158 H508" stroke="#4eb5ff" stroke-width="1.5"/>

  <rect x="510" y="130" width="110" height="56" rx="8" fill="#0d0d0d" stroke="#4eb5ff" stroke-width="1.5"/>
  <text x="565" y="155" text-anchor="middle" fill="#f0f0f0" font-family="system-ui, sans-serif" font-size="12" font-weight="500">LLM reason</text>
  <text x="565" y="172" text-anchor="middle" fill="#888888" font-family="ui-monospace, monospace" font-size="10">explainable</text>

  <!-- bottom flow -->
  <rect x="180" y="260" width="340" height="72" rx="8" fill="#0d0d0d" stroke="#222222" stroke-width="1"/>
  <text x="350" y="290" text-anchor="middle" fill="#7dd8ff" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Due diligence � risk � compliance answers</text>
  <text x="350" y="312" text-anchor="middle" fill="#888888" font-family="ui-monospace, monospace" font-size="11">grounded citations from the knowledge graph</text>

  <path d="M400 198 V248" stroke="#4eb5ff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4eb5ff"/>
    </marker>
  </defs>
</svg>
